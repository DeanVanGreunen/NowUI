[package]
name = "nowui-bundle"
version = "0.1.0"
edition = "2021"
description = "CLI that packs local image assets into a .nowdat sidecar archive for a NowUI app's Image widget."
license = "MIT"
repository = "https://github.com/DeanVanGreunen/NowUI"

[[bin]]
name = "nowui-bundle"
path = "src/main.rs"

[dependencies]
nowui-image = { path = "../nowui-image", version = "0.1.0" }
